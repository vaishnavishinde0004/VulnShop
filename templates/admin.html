<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel - VulnShop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand fw-bold">
            🛒 VulnShop Admin
        </span>

    </div>

</nav>


<div class="container py-5">


    <div class="alert alert-danger">

        ⚠️ Administrative Area

    </div>


    <h1>
        User Management
    </h1>


    <p class="text-muted">
        User information stored by VulnShop.
    </p>


    <div class="table-responsive">


        <table class="table table-bordered table-striped">


            <thead class="table-dark">

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Username
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Role
                    </th>

                </tr>

            </thead>


            <tbody>

                {% for user in users %}

                <tr>

                    <td>
                        {{ user["id"] }}
                    </td>

                    <td>
                        {{ user["username"] }}
                    </td>

                    <td>
                        {{ user["email"] }}
                    </td>

                    <td>
                        {{ user["role"] }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>


        </table>


    </div>


    <a href="/" class="btn btn-dark">
        Back to Home
    </a>


</div>


</body>

</html>
