<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - VulnShop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            🛒 VulnShop
        </a>


        <a
            href="/logout"
            class="btn btn-outline-light"
        >
            Logout
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="card shadow">

        <div class="card-body p-5">

            <h1>
                Welcome, {{ username }} 👋
            </h1>


            <p class="text-muted">

                You are currently logged in as:

                <strong>
                    {{ role }}
                </strong>

            </p>


            <hr>


            <div class="row g-4 mt-2">


                <div class="col-md-4">

                    <div class="card bg-light">

                        <div class="card-body">

                            <h5>
                                Orders
                            </h5>

                            <h2>
                                0
                            </h2>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="card bg-light">

                        <div class="card-body">

                            <h5>
                                Cart
                            </h5>

                            <h2>
                                0
                            </h2>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="card bg-light">

                        <div class="card-body">

                            <h5>
                                Account
                            </h5>

                            <h2>
                                Active
                            </h2>

                        </div>

                    </div>

                </div>

            </div>


            <div class="mt-5">

                <a
                    href="/"
                    class="btn btn-dark"
                >
                    Continue Shopping
                </a>


                <a
                    href="/reviews"
                    class="btn btn-outline-dark"
                >
                    Reviews
                </a>

            </div>

        </div>

    </div>

</div>


</body>

</html>
