<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reviews - VulnShop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            🛒 VulnShop
        </a>

    </div>

</nav>


<div class="container py-5">


    <h1>
        Customer Reviews
    </h1>


    <p class="text-muted">
        Tell us what you think about VulnShop.
    </p>


    <div class="card shadow-sm mb-5">

        <div class="card-body">


            <form method="POST">


                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Your name"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Review
                    </label>

                    <textarea
                        name="review"
                        class="form-control"
                        rows="4"
                        placeholder="Write your review..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Review
                </button>


            </form>


        </div>

    </div>


    <h3>
        Reviews
    </h3>


    {% for review in reviews %}

        <div class="card mb-3">

            <div class="card-body">

                <strong>
                    {{ review["username"] }}
                </strong>

                <hr>

                <!-- INTENTIONALLY UNSAFE -->
                {{ review["review"] | safe }}

            </div>

        </div>

    {% else %}

        <p class="text-muted">
            No reviews yet.
        </p>

    {% endfor %}


    <a href="/">
        ← Back to Home
    </a>


</div>


</body>

</html>
